name: macOS build

on:
  push:
    paths: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift test

      - name: Build app
        run: |
          chmod +x scripts/*.sh
          UNIVERSAL=1 ./scripts/build-app.sh

      - name: Zip app
        run: ditto -c -k --keepParent "build/Claude Usage.app" "build/ClaudeUsage-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage-macOS
          path: macos/build/ClaudeUsage-macOS.zip
